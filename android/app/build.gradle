plugins { id 'com.android.application' }

android {
    namespace 'ph.peso.employment'
    compileSdk 35
    defaultConfig {
        applicationId 'ph.peso.employment'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.5.0'
    }
    buildTypes {
        debug { applicationIdSuffix '.local'; manifestPlaceholders = [allowCleartext: 'true'] }
        release { minifyEnabled false; manifestPlaceholders = [allowCleartext: 'false'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
